version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lung_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lung_network

  postgres:
    image: bitnami/postgresql:latest
    container_name: lung_db
    restart: always
    environment:
      POSTGRESQL_USERNAME: user
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: lungdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lungdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_network

  redis:
    image: redis:7-alpine
    container_name: lung_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lung_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery,inference,reports,emails,backups
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - lung_network
      
  nginx:
    image: nginx:alpine
    container_name: lung_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - lung_network

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_MINIO_URL: https://s3.amazonaws.com
        NEXT_PUBLIC_APP_NAME: "LungDetect AI"
        NEXT_PUBLIC_APP_VERSION: "1.0.0"
        NEXT_PUBLIC_DEFAULT_LANGUAGE: en
        NEXT_PUBLIC_ENABLE_GRADCAM: "true"
        NEXT_PUBLIC_ENABLE_ONBOARDING: "true"
        NEXT_PUBLIC_EMAILJS_SERVICE_ID: "service_rltt2o9"
        NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: "template_lizut7u"
        NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: "GsEMmAKjKPLWQ91Eu"
    container_name: lung_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - lung_network

networks:
  lung_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
