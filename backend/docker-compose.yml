services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lung_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - lung_network

  postgres:
    image: bitnami/postgresql:latest
    container_name: lung_db
    restart: always
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: user
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: lungdb
    command: >
      bash -c "
      /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh &
      sleep 10;
      psql -U user -d lungdb -c 'ALTER SYSTEM SET max_wal_senders = 10;';
      psql -U user -d lungdb -c 'ALTER SYSTEM SET max_replication_slots = 10;';
      psql -U user -d lungdb -c 'SELECT pg_reload_conf();';
      wait
      "
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lungdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_network

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: lung_db_replica
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_MASTER_HOST: postgres
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_USERNAME: user
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: lungdb
    command: >
      bash -c "
      /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh &
      sleep 10;
      psql -U user -d lungdb -c \"ALTER SYSTEM SET wal_receiver_timeout = '2min';\";
      psql -U user -d lungdb -c 'SELECT pg_reload_conf();';
      wait
      "
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lungdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_network

  redis:
    image: redis:7-alpine
    container_name: lung_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_network

  minio:
    image: minio/minio:latest
    container_name: lung_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lung_celery_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery,inference,reports,emails,backups
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
      - postgres
      - minio
    networks:
      - lung_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lung_celery_beat
    restart: always
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    depends_on:
      - redis
      - postgres
    networks:
      - lung_network

  nginx:
    image: nginx:alpine
    container_name: lung_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - lung_network

networks:
  lung_network:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  minio_data:
