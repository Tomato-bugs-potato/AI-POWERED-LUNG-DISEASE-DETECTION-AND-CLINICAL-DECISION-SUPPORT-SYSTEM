# Celery Worker — processes inference, report generation, email, and backup tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: lung-detection
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: lung-api:latest
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - secretRef:
                name: api-secrets
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
# Celery Beat — periodic task scheduler (DB backups, session cleanup)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: lung-detection
  labels:
    app: celery-beat
spec:
  replicas: 1   # Must be exactly 1 to avoid duplicate scheduled tasks
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: lung-api:latest
          command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--scheduler=celery.beat:PersistentScheduler"]
          envFrom:
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
