# =============================================================================
# Kubernetes Secret — all environment variables for the lung-detection stack
# TEMPLATE ONLY — replace every <CHANGE_ME> before applying.
# NEVER commit real secrets to git.
#
# Apply with:  kubectl apply -f k8s/secrets.yaml
# Or use Sealed Secrets / External Secrets Operator in production.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: lung-detection
type: Opaque
stringData:
  # ── App ────────────────────────────────────────────────────────────────────
  APP_NAME: "Lung Disease Detection API"
  DEBUG: "false"
  API_V1_PREFIX: "/api/v1"

  # ── Database (must match postgres StatefulSet env) ──────────────────────
  DATABASE_URL: "postgresql+asyncpg://<DB_USER>:<DB_PASS>@postgres:5432/<DB_NAME>"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  POSTGRES_USER: "<DB_USER>"
  POSTGRES_PASSWORD: "<DB_PASS>"
  POSTGRES_DB: "<DB_NAME>"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  # ── Redis ───────────────────────────────────────────────────────────────
  REDIS_URL: "redis://redis:6379/0"

  # ── JWT — generate: python -c "import secrets; print(secrets.token_hex(32))"
  JWT_SECRET_KEY: "<CHANGE_ME_min_64_chars>"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"

  # ── OTP ─────────────────────────────────────────────────────────────────
  OTP_EXPIRE_MINUTES: "5"
  OTP_MAX_ATTEMPTS: "3"

  # ── Field Encryption (AES-256) ──────────────────────────────────────────
  # Generate: python -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
  FIELD_ENCRYPTION_KEY: "<CHANGE_ME_base64_32_bytes>"

  # ── MinIO ────────────────────────────────────────────────────────────────
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "<CHANGE_ME>"
  MINIO_SECRET_KEY: "<CHANGE_ME>"
  MINIO_BUCKET_IMAGES: "xray-images"
  MINIO_BUCKET_REPORTS: "reports"
  MINIO_SECURE: "true"
  PRESIGNED_URL_EXPIRE_SECONDS: "900"
  BACKUP_BUCKET: "db-backups"
  BACKUP_RETENTION_DAYS: "180"

  # ── MinIO container credentials (used by the minio StatefulSet itself) ──
  MINIO_ROOT_USER: "<CHANGE_ME>"
  MINIO_ROOT_PASSWORD: "<CHANGE_ME>"

  # ── AI Service ───────────────────────────────────────────────────────────
  AI_SERVICE_URL: "http://ai-service:8001"
  AI_INFERENCE_TIMEOUT_SECONDS: "12"
  AI_INTERNAL_API_KEY: "<CHANGE_ME_random_key>"
  AI_MODEL_VERSION: "v1.0.0"

  # ── Email (SMTP) ──────────────────────────────────────────────────────────
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "<YOUR_GMAIL_ADDRESS>"
  SMTP_PASSWORD: "<YOUR_GMAIL_APP_PASSWORD>"
  EMAIL_FROM: "<YOUR_GMAIL_ADDRESS>"
