apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: lung-detection
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: lung-ai:latest
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: api-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              # nvidia.com/gpu: 1  # Uncomment for GPU support
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: lung-detection
spec:
  selector:
    app: ai-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
